name: Persist verified Multi3WOZ French research-only training
on:
  push:
    branches: [research/multi3woz-dialogue-train-20261118]
    paths:
      - .github/workflows/persist-multi3woz.yml
permissions:
  actions: read
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download completed training checkpoint, no original dialogue text
        uses: actions/download-artifact@v4
        with:
          run-id: 44239515604
          github-token: ${{ github.token }}
          repository: Helloworld9099/veritastester
          name: multi3woz-french-research
          path: ${{ runner.temp }}/multi3woz
      - name: Verify partition provenance, selected model and frozen test
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from shutil import copy2
          root=Path(os.environ["RUNNER_TEMP"])/"multi3woz"
          report_files=list(root.rglob("report.json"))
          frozen_files=list(root.rglob("multi3woz_evaluation.json"))
          selected=list(root.rglob("candidate_selected.safetensors"))
          assert len(report_files)==len(frozen_files)==len(selected)==1
          report=json.loads(report_files[0].read_text())
          test=json.loads(frozen_files[0].read_text())
          assert report["language"] == test["language"] == "french"
          assert report["selected"] == test["selected_on_dev_only"] == "step72"
          assert report["source_commit"]=="c65e80fe120704125255de5cf582a51ebaa285cd"
          assert report["source_zip_sha256"]=="da238995eed56ed76551c19d0d3fc58e039b62197514ca0d7b705880664ca65e"
          assert report["warm_adapter_sha256"]=="072f7f5d2d90b26991c5c62bf8ddb40f686f65e66be52717e7b121d507008ad9"
          assert report["selected_pair_groups"] == test["split_manifest"]
          assert test["test_dialogues_separate_from_train_and_dev"] is True
          assert (test["train_n"],test["dev_n"],test["test_n"])==(1536,128,256)
          assert len({test["split_manifest"][k]["dialogue_ids_sha256"]
                      for k in ("train","dev","test")})==3
          assert all(test["frozen_test_scores"][arm]["n"]==256
                     for arm in ("base","previous","selected"))
          assert test["no_human_semantic_quality_ratings"] is True
          selected_sha=hashlib.sha256(selected[0].read_bytes()).hexdigest()
          assert selected_sha==report["selected_candidate_sha256"]
          out=Path("experiments/multi3woz_20261118/saved/french")
          out.mkdir(parents=True,exist_ok=False)
          for source, name in ((report_files[0],"report.json"),
                               (frozen_files[0],"multi3woz_evaluation.json"),
                               (selected[0],"adapter_selected.safetensors")):
              copy2(source,out/name)
          other=sorted(root.rglob("candidate_step*.safetensors"))
          assert len(other)==4
          for step in other:
              copy2(step,out/step.name)
          with (out/"SHA256SUMS.txt").open("w") as f:
              for path in sorted(out.iterdir()):
                  if path.name!="SHA256SUMS.txt":
                      f.write(hashlib.sha256(path.read_bytes()).hexdigest()+"  "+path.name+"\n")
          print("PRESERVED trained experimental candidate", report["selected"], selected_sha)
          print("FROZEN TEST",test["frozen_test_scores"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/multi3woz_20261118/saved
          git diff --cached --stat
          git commit -m "research: preserve Multi3WOZ French LoRA checkpoint and frozen test [skip ci]"
          git push origin "HEAD:refs/heads/research/multi3woz-dialogue-train-20261118"
