name: Mine genuine licensed multilingual conversational context without fake gold targets

on:
  push:
    branches: [feat/global-language-architecture-and-conversation-training-20261121]
    paths:
      - .github/workflows/real-openassistant-context-mining.yml
      - research/conversation_growth/mine_openassistant.py
      - research/conversation_growth/context_gold.py
      - research/conversation_growth/tests/test_context.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authentic-OASST-dialogue-research-v1
  cancel-in-progress: false

jobs:
  extract-no-fake-parallel:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONPATH: ".:src"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only open dataset reading tools (no paid teachers)
        run: python -m pip install 'datasets==2.21.0' 'huggingface-hub==0.36.0'
      - name: Prove no fabricated bilingual references, future turns or NC data
        run: |
          python -m unittest research.conversation_growth.tests.test_context -v
          python -m py_compile research/conversation_growth/mine_openassistant.py research/conversation_growth/context_gold.py
      - name: Download actual Apache-2.0 OpenAssistant TRAIN messages, mine real context and slang for bilingual review only
        run: python -u research/conversation_growth/mine_openassistant.py
      - name: Check real dataset revision and separate no-gold mining report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('research/conversation_growth/openassistant_mining/manifest.json')
          d=json.loads(f.read_text())
          assert d['status']=='real_openassistant_context_candidate_mining_no_parallel_gold'
          assert len(d['source_dataset_sha'])==40
          assert d['license']=='Apache-2.0'
          assert d['original_message_count']>1000
          assert d['valid_nonprivate_message_count']>1000
          assert d['candidate_for_human_bilingual_review']>0
          assert d['bilingual_targets_available'] is False
          assert d['new_verified_parallel_training_examples']==0
          assert d['training_updates_executed']==0
          assert d['future_dialogue_in_context'] is False
          assert d['human_95_percent_meaning_accuracy_verified'] is False
          print('ACTUAL_CONTEXT_CORPUS_MINED_BUT_NOT_FALSELY_TRAINED',d)
          PY
      - name: Preserve nonidentifying source license, sample counts and exact SHA only in Git
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/conversation_growth/openassistant_mining/manifest.json
          git commit -m 'research: preserve real licensed dialogue mining counts and no-fabricated-gold provenance [skip ci]'
          git pull --rebase origin feat/global-language-architecture-and-conversation-training-20261121
          git push origin HEAD:refs/heads/feat/global-language-architecture-and-conversation-training-20261121
      - name: Export small reviewer candidate bundle separately, never supervised gold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentic-English-Spanish-French-unpaired-dialogue-for-bilingual-review
          path: |
            ${{ runner.temp }}/bridgecaption-oasst1-review/bilingual_review_candidates.jsonl
            research/conversation_growth/openassistant_mining/manifest.json
          if-no-files-found: warn
          retention-days: 30
