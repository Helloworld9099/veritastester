name: TRAIN Spanish context-conditioned LoRA (noncommercial research; one-off)

on:
  push:
    branches: [research/spanish-conversation-lora-20261120]
    paths:
      - .github/workflows/train-spanish-context.yml
      - experiments/spanish_context_20261120/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spanish-context-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spanish-conversation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU-only free training dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0' 'datasets==2.21.0'
      - name: Test Spanish context, alignment and isolation guards
        run: |
          python -m compileall -q experiments/spanish_context_20261120
          python -m unittest discover -s experiments/spanish_context_20261120/tests -p 'test_*.py' -v
      - name: Audit actual pinned original subtitle alignment before training
        run: |
          python -u experiments/spanish_context_20261120/train_context.py --inspect-alignment
      - name: TRAIN 240 Spanish LoRA optimizer updates with contextual bilingual subtitles
        run: |
          python -u experiments/spanish_context_20261120/train_context.py \
            --output-dir "$RUNNER_TEMP/spanish-context"
      - name: Retain only experimental candidate weights and aggregate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spanish-context-noncommercial-research
          path: |
            ${{ runner.temp }}/spanish-context/report.json
            ${{ runner.temp }}/spanish-context/spanish_context_evaluation.json
            ${{ runner.temp }}/spanish-context/candidate_step*.safetensors
            ${{ runner.temp }}/spanish-context/candidate_selected.safetensors
          if-no-files-found: warn
          retention-days: 30
