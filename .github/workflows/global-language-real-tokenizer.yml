name: Audit real one-model tokenizer against 8,623 documented world languages

on:
  push:
    branches: [feat/global-language-architecture-and-conversation-training-20261121]
    paths:
      - .github/workflows/global-language-real-tokenizer.yml
      - research/global_languages/real_tokenizer_audit.py

permissions:
  contents: write

jobs:
  native-M2M100-model-identifiers:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ".:src"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tokenizer-only libraries; do NOT download 2GB model or run unapproved training
        run: |
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub==0.36.0'
      - name: Prove actual pinned model supports native M2M100 languages, Glottolog-only languages remain unsupported
        run: python -u research/global_languages/real_tokenizer_audit.py
      - name: Verify every real native model code is distinguished from human-reviewed coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/global_languages/generated/real_tokenizer_capabilities.json')
          d=json.loads(p.read_text())
          assert d['status']=='real_pinned_M2M100_native_tokenizer_checked_against_Glottolog'
          assert 90<=d['native_language_count']<=120
          assert d['Glottolog_documented_languages']==8623
          assert d['native_possible_pairs']==d['native_language_count']*(d['native_language_count']-1)
          assert d['independently_human_validated_new_language_pairs']==0
          assert d['production_models_changed'] is False
          assert d['slang_or_context_accuracy_claim'] is False
          assert len(d['Glottolog_not_native_example'])==8
          print('GENUINE_NATIVE_TOKENIZER_WORLD_LANGUAGE_GAP_VERIFIED',d['native_language_count'])
          PY
      - name: Save explicit real tokenizer capability proof without changing active app
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/global_languages/generated/real_tokenizer_capabilities.json
          git commit -m 'research: record pinned native M2M100 vs actual Glottolog language coverage [skip ci]'
          git pull --rebase origin feat/global-language-architecture-and-conversation-training-20261121
          git push origin HEAD:refs/heads/feat/global-language-architecture-and-conversation-training-20261121
      - name: Retain tokenizer audit evidence if branch push conflicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-native-model-tokenizer-world-coverage
          path: research/global_languages/generated/real_tokenizer_capabilities.json
          if-no-files-found: warn
          retention-days: 30
