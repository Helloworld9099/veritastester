name: Test human-evaluation packet integrity (no model training)

on:
  push:
    branches: [research/blinded-human-evaluation-20261117]
    paths:
      - experiments/translation_quality_20261117/**
      - .github/workflows/human-review-packets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and verify review packet, rater evidence and statistical gating
        run: |
          python -m compileall -q experiments/translation_quality_20261117
          python -m unittest discover -s experiments/translation_quality_20261117/tests -p 'test_*.py' -v
