name: Measure English-to-Spanish original-model baseline without touching holdout

on:
  push:
    branches: [train/es-en-v2]
    paths:
      - .github/workflows/es-en-v2-en-es-baseline.yml
      - research/es_en_v2/en_es_baseline.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  en-es-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'datasets==2.21.0' 'huggingface-hub>=0.34,<1.0'
      - name: Run English-to-Spanish pretrained-model comparison and CPU latency
        run: python -u research/es_en_v2/en_es_baseline.py
      - name: Verify experiment status and permanently save aggregate only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('research/es_en_v2/benchmarks/en_es/en_es_original_baseline.json')
          data=json.loads(p.read_text())
          assert data['direction']=='en-es'
          assert data['development_split']=='publisher_validation_not_test'
          assert data['development_case_count']==128
          assert data['test_or_final_holdout_accessed'] is False
          assert data['human_95_percent_adequacy_verified'] is False
          assert data['synthetic_translation_only_latency']['n']==16
          (p.parent/'SHA256SUMS.txt').write_text(
              hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print('EN_ES_BASELINE_VERIFIED',json.dumps({
              'chrf':data['dev_chrf_not_accuracy'],'bleu':data['dev_bleu_not_accuracy'],
              'p95_s':data['synthetic_translation_only_latency']['p95_seconds']}))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/es_en_v2/benchmarks/en_es
          git commit -m 'research: preserve measured English-to-Spanish CPU baseline and model SHA [skip ci]'
          git pull --rebase origin train/es-en-v2
          git push origin HEAD:refs/heads/train/es-en-v2
      - name: Preserve result if push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es-en-v2-original-english-spanish-development-baseline
          path: research/es_en_v2/benchmarks/en_es/en_es_original_baseline.json
          if-no-files-found: warn
          retention-days: 30
