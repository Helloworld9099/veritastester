name: TRAIN contextual French LoRA on real WMT24 bilingual chat (NC research only)
on:
  push:
    branches: [research/wmt24-contextual-french-20261119]
    paths:
      - .github/workflows/train-wmt24-context.yml
      - experiments/wmt24_context_20261119/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-chat-context-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-context-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install free CPU-only Marian and LoRA research dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0'
      - name: Enforce no future-turn, gold-reference or cross-dialogue context leakage
        run: |
          python -m compileall -q experiments/wmt24_context_20261119
          python -m unittest discover -s experiments/wmt24_context_20261119/tests -p 'test_*.py' -v
      - name: ACTUALLY TRAIN 240 French context-aware LoRA updates using only official TRAIN
        run: |
          python -u experiments/wmt24_context_20261119/train_context.py \
            --output-dir "$RUNNER_TEMP/wmt24-context"
      - name: Preserve only NONCOMMERCIAL research weights and validation-only metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wmt24-context-french-research-only
          path: |
            ${{ runner.temp }}/wmt24-context/report.json
            ${{ runner.temp }}/wmt24-context/context_research_evaluation.json
            ${{ runner.temp }}/wmt24-context/candidate_step*.safetensors
            ${{ runner.temp }}/wmt24-context/candidate_selected.safetensors
          if-no-files-found: warn
          retention-days: 30
