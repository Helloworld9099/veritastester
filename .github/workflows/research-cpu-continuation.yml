name: BridgeCaption CPU research continuation

on:
  push:
    branches: [research/cpu-continuation-20261117]
    paths:
      - research/cpu_continuation_20261117/**
      - .github/workflows/research-cpu-continuation.yml
  workflow_dispatch:

concurrency:
  group: bridgecaption-cpu-research-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  french-continuation:
    name: Research-only French LoRA continuation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU-only PyTorch and pinned research dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0'
      - name: Compile and test training logic
        run: |
          python -m py_compile research/cpu_continuation_20261117/train.py
          python -m unittest discover -s research/cpu_continuation_20261117/tests -p 'test_*.py' -v
      - name: Run bounded training and development-only evaluation
        run: python research/cpu_continuation_20261117/train.py --output-dir "$RUNNER_TEMP/bridgecaption-cpu-training"
      - name: Preserve only aggregate results and candidate adapter weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridgecaption-cpu-research-candidates
          path: |
            ${{ runner.temp }}/bridgecaption-cpu-training/report.json
            ${{ runner.temp }}/bridgecaption-cpu-training/candidate_step*.safetensors
            ${{ runner.temp }}/bridgecaption-cpu-training/candidate_selected.safetensors
          if-no-files-found: warn
          retention-days: 14
