name: QED lecture subtitles research-only CPU training

on:
  push:
    branches: [research/qed-caption-domain-20261117]
    paths:
      - .github/workflows/qed-subtitles-research.yml
      - experiments/qed_subtitles_20261117/**
      - experiments/cpu_continuation_20261117/train.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qed-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-qed:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        language: [french, spanish]
    name: QED ${{ matrix.language }} model continuation
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install free CPU runtime
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0'
      - name: Validate parser and grouping safeguards
        run: |
          python -m compileall -q experiments/qed_subtitles_20261117
          python -m unittest discover -s experiments/qed_subtitles_20261117/tests -p 'test_*.py' -v
      - name: Train and evaluate once on video-group-heldout research data
        run: |
          python -u experiments/qed_subtitles_20261117/train_qed.py --language '${{ matrix.language }}' --output-dir "$RUNNER_TEMP/qed-${{ matrix.language }}"
      - name: Preserve only aggregate reports and candidate LoRA weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qed-research-${{ matrix.language }}
          path: |
            ${{ runner.temp }}/qed-${{ matrix.language }}/report.json
            ${{ runner.temp }}/qed-${{ matrix.language }}/qed_evaluation.json
            ${{ runner.temp }}/qed-${{ matrix.language }}/candidate_step*.safetensors
            ${{ runner.temp }}/qed-${{ matrix.language }}/candidate_selected.safetensors
          if-no-files-found: warn
          retention-days: 30
