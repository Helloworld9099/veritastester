name: Verify best one-model checkpoint versus prior language specialists

on:
  push:
    branches: [train/one-multilingual-student-20261121]
    paths:
      - .github/workflows/one-multilingual-selected-comparison.yml
      - research/multilingual_student/compare_selected.py

permissions:
  contents: write

jobs:
  same-dev-baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONPATH: ".:src"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned free CPU Marian evaluation dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'datasets==2.21.0' 'huggingface-hub==0.36.0'
      - name: Evaluate old Spanish/French specialists on EXACT selected-model 12-example developer cohort
        run: |
          python -m py_compile research/multilingual_student/compare_selected.py
          python -u research/multilingual_student/compare_selected.py
      - name: Verify same source, no final test, no model promotion
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('research/multilingual_student/experiment_002/selected_legacy_comparison.json')
          r=json.loads(p.read_text())
          assert r['status']=='actual_selected_single_model_vs_old_specialists_on_identical_DEV'
          assert set(r['results'])=={'es-en','fr-en','en-es'}
          assert all(v['n']==12 and v['same_development_case_ids'] for v in r['results'].values())
          assert r['selected_research_adapter_sha256']=='a00c7965211853df07ce3fa032a76283dfc984dcdaeac85e03263445029ffb8e'
          assert r['selected_model_is_one_shared_neural_network'] is True
          assert not r['production_promoted']
          assert not r['independent_95_percent_meaning_accuracy_verified']
          assert not r['reviewed_500_or_final_holdout_used_for_selection']
          assert r['paid_spend_usd']==0
          (p.parent/'selected_legacy_comparison.sha256').write_text(
              hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print('FAIR_SELECTED_STUDENT_VS_OLD_TRANSLATORS_VERIFIED',r['results'])
          PY
      - name: Preserve original-language-vs-unified-model comparison as research only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/multilingual_student/experiment_002/selected_legacy_comparison*
          git commit -m 'research: preserve fair 12-case DEV comparison of selected multilingual model vs old specialists [skip ci]'
          git pull --rebase origin train/one-multilingual-student-20261121
          git push origin HEAD:refs/heads/train/one-multilingual-student-20261121
      - name: Retain comparison report if branch push races
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-one-model-vs-old-specialists-dev-12
          path: research/multilingual_student/experiment_002/selected_legacy_comparison.json
          if-no-files-found: warn
          retention-days: 30
