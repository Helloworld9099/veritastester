name: Verify never-trained-on real French dialogue test source
on:
  push:
    branches: [research/diabla-frozen-dialogue-benchmark-20261118]
    paths:
      - .github/workflows/inspect-diabla-holdout.yml
      - experiments/diabla_20261118/**
permissions:
  contents: read
jobs:
  freeze-test-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public dataset schema tools (no model training)
        run: |
          python -m pip install 'datasets==2.21.0' 'huggingface-hub>=0.34,<1.0'
      - name: Verify complete dialogue group holdout and language metadata
        run: |
          python -m compileall -q experiments/diabla_20261118
          python -m unittest discover -s experiments/diabla_20261118/tests -p 'test_*.py' -v
          python -u experiments/diabla_20261118/freeze_external_holdout.py
