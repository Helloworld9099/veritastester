name: Compare one multilingual student against preserved French and Spanish champions

on:
  push:
    branches: [train/one-multilingual-student-20261121]
    paths: [research/multilingual_student/comparison_request.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  champion-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ".:src"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official CPU-only tools for pinned historical comparison
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'datasets==2.21.0' 'huggingface-hub==0.36.0'
      - name: Evaluate old licensed checkpoint and real student on same 6 publisher DEV prompts per route
        run: python -u research/multilingual_student/compare_to_legacy.py
      - name: Verify fairness, no hidden test and correct no-promotion outcome
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          path=Path('research/multilingual_student/experiment_001/legacy_comparison.json')
          d=json.loads(path.read_text())
          assert d['status']=='real_fair_old_models_vs_single_multilingual_student_dev_comparison'
          assert set(d['results'])=={'es-en','fr-en','en-es'}
          assert all(x['n']==6 and x['same_frozen_development_inputs'] for x in d['results'].values())
          assert not d['production_candidate_approved']
          assert not d['independent_bilingual_pass_rates_available']
          assert not d['publisher_test_or_final_holdout_accessed']
          assert not d['reviewed_500_used_for_training_or_selection']
          (path.parent/'legacy_comparison.sha256').write_text(
              hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n')
          print('SAME_DEV_COMPARISON_VERIFIED',d['results'])
          PY
      - name: Preserve champion comparisons without changing legacy checkpoints
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/multilingual_student/experiment_001/legacy_comparison*
          git commit -m 'research: preserve real original-specialist vs one shared model DEV comparisons [skip ci]'
          git pull --rebase origin train/one-multilingual-student-20261121
          git push origin HEAD:refs/heads/train/one-multilingual-student-20261121
      - name: Retain evidence if push races
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-multilingual-vs-preserved-language-specialists
          path: research/multilingual_student/experiment_001/legacy_comparison.json
          if-no-files-found: warn
          retention-days: 30
