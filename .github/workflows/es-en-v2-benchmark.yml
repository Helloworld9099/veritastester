name: Benchmark actual Spanish CPU inference (no final test)

on:
  push:
    branches: [train/es-en-v2]
    paths:
      - .github/workflows/es-en-v2-benchmark.yml
      - research/es_en_v2/benchmark.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only runtime, not a paid API
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0'
      - name: Measure actual baseline and adapter translation-only CPU latency
        run: python -u research/es_en_v2/benchmark.py
      - name: Commit reproducible report without test data or model activation
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('research/es_en_v2/benchmarks/cpu_benchmark.json')
          obj=json.loads(p.read_text())
          assert obj['status']=='real_cpu_translation_only_benchmark'
          assert obj['meaning_preservation_accuracy_measured'] is False
          assert obj['complete_audio_to_captions_latency_measured'] is False
          assert obj['base']['requests']==obj['stage3_adapter']['requests']==16
          (p.parent/'SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print('BENCHMARK_RSS_KIB',obj['peak_resident_set_size_kib_linux'])
          print('BENCHMARK_ADAPTED_P95_SECONDS',obj['stage3_adapter']['p95_seconds'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/es_en_v2/benchmarks
          git commit -m 'research: preserve real CPU Spanish baseline/adapted latency receipt [skip ci]'
          git pull --rebase origin train/es-en-v2
          git push origin HEAD:refs/heads/train/es-en-v2
      - name: Retain benchmark report if push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es-en-v2-cpu-inference-baseline
          path: research/es_en_v2/benchmarks/cpu_benchmark.json
          if-no-files-found: warn
          retention-days: 30
