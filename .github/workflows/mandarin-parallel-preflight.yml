name: BridgeCaption Mandarin parallel-data preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-mandarin-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ".:src"
      BRIDGE_NO_PAID_APIS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dataset preparation dependencies
        run: |
          python -m pip install 'datasets==2.21.0' 'huggingface-hub==0.36.0'
      - name: Run Mandarin data preparation tests
        run: python -m unittest discover -s research/mandarin_growth/tests -p 'test_*.py' -v
      - name: Prepare licensed Mandarin parallel data
        run: python -m research.mandarin_growth.prepare
      - name: Save reproducible source and split receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridgecaption-mandarin-parallel-preflight
          path: research/mandarin_growth/experiment_001/
          if-no-files-found: warn
          retention-days: 30
