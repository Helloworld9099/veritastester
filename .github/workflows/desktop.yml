name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/desktop.yml'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk ffmpeg libportaudio2 libxcb-xinerama0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --windowed --name BridgeCaption --collect-all faster_whisper --collect-all ctranslate2 desktop_entry.py
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: bridgecaption-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
