name: Desktop builds and in-place upgrades
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'scripts/*desktop*.py'
      - 'scripts/sign_update.py'
      - 'desktop_entry.py'
      - 'pyproject.toml'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
          - os: windows-2022
            artifact: windows-x86_64
          - os: macos-15
            artifact: darwin-arm64
          - os: macos-15-intel
            artifact: darwin-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk ffmpeg libportaudio2
      - name: Install Python dependencies
        run: python -m pip install -e ".[test]" "pyinstaller>=6.14,<7"
      - name: Run desktop unit tests
        run: python -m pytest -q tests/test_updates.py tests/test_overlay_interface.py
      - name: Build previous version for upgrade testing
        if: runner.os != 'Linux'
        run: python scripts/build_desktop.py --version 0.1.0 --output smoke-previous
      - name: Build candidate
        run: python scripts/build_desktop.py --version 0.1.1 --output smoke-candidate
      - name: Install and verify the upgrade on Windows
        if: runner.os == 'Windows'
        run: python scripts/smoke_desktop_upgrade.py smoke-previous/BridgeCaption-windows-x86_64-setup.exe smoke-candidate/BridgeCaption-windows-x86_64-setup.exe
      - name: Install and verify the upgrade on macOS
        if: runner.os == 'macOS'
        run: python scripts/smoke_desktop_upgrade.py smoke-previous/BridgeCaption-${{ matrix.artifact }}.zip smoke-candidate/BridgeCaption-${{ matrix.artifact }}.zip
      - name: Upload test build (not for distribution)
        uses: actions/upload-artifact@v4
        with:
          name: bridgecaption-test-${{ matrix.artifact }}
          path: smoke-candidate/
          if-no-files-found: error
