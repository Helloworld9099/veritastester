name: MASSIVE voice utterance research (free CPU)

on:
  push:
    branches: [research/massive-voice-utterances-20261117]
    paths:
      - .github/workflows/massive-research.yml
      - experiments/massive_20261117/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continue-translation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        language: [french, spanish]
    name: MASSIVE ${{ matrix.language }} assistant-utterance LoRA
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU and author-dataset tools
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0' 'datasets==2.21.0'
      - name: Verify dataset alignment and strict split preservation
        run: |
          python -m compileall -q experiments/massive_20261117
          python -m unittest discover -s experiments/massive_20261117/tests -p 'test_*.py' -v
      - name: Continue custom translation adapter on localized spoken commands
        run: |
          python -u experiments/massive_20261117/train_massive.py --language '${{ matrix.language }}' --output-dir "$RUNNER_TEMP/massive-${{ matrix.language }}"
      - name: Save aggregate evidence and candidate adapters only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: massive-research-${{ matrix.language }}
          path: |
            ${{ runner.temp }}/massive-${{ matrix.language }}/report.json
            ${{ runner.temp }}/massive-${{ matrix.language }}/massive_evaluation.json
            ${{ runner.temp }}/massive-${{ matrix.language }}/candidate_step*.safetensors
            ${{ runner.temp }}/massive-${{ matrix.language }}/candidate_selected.safetensors
          if-no-files-found: warn
          retention-days: 30
