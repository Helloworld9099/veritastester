name: Preserve Stage7 Tatoeba trained checkpoint and frozen real-data evaluation
on:
  push:
    branches: [research/tatoeba-conversational-stage7-20261118]
    paths:
      - .github/workflows/persist-tatoeba-stage7.yml
permissions:
  actions: read
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve already successful original training artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 44453782314
          github-token: ${{ github.token }}
          repository: Helloworld9099/veritastester
          name: tatoeba-stage7-french-research
          path: ${{ runner.temp }}/stage7
      - name: Verify pinned checkpoint, historical exclusions and reserved test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from shutil import copy2

          incoming=Path(os.environ["RUNNER_TEMP"])/"stage7"
          rf=list(incoming.rglob("report.json"))
          ef=list(incoming.rglob("stage7_evaluation.json"))
          chosen=list(incoming.rglob("candidate_selected.safetensors"))
          assert len(rf)==len(ef)==len(chosen)==1,"Original stage-7 run artifacts missing"
          report=json.loads(rf[0].read_text())
          evidence=json.loads(ef[0].read_text())
          assert report["language"]==evidence["language"]=="french"
          assert report["selected"]==evidence["selected_using_dev_only"]=="step48"
          assert report["completed_updates"]==evidence["completed_updates"]==192
          sha=hashlib.sha256(chosen[0].read_bytes()).hexdigest()
          assert sha==report["selected_candidate_sha256"]
          m=evidence["frozen_source_splits"]
          assert m==report["data_integrity"]
          assert m["warm_model_sha256"]=="fba2bd78958bf0bf8a4c14dc55e601e08663633718c4c9c17f91ef9b52dcfa1c"
          assert (m["Tatoeba_train"]["count"],m["Tatoeba_reserved_not_used_for_selection"]["count"])==(2304,256)
          assert m["Tatoeba_train"]["groups"]==2304
          assert m["Tatoeba_reserved_not_used_for_selection"]["groups"]==256
          assert (m["Tatoeba_train"]["group_sha256"]!=
                  m["Tatoeba_reserved_not_used_for_selection"]["group_sha256"])
          assert m["historical_Tatoeba_quick12000_entire_components_excluded"] is True
          assert m["MASSIVE_OLD_TRAIN_replay_n"]==768
          assert evidence["human_90_percent_adequacy_verified"] is False
          assert evidence["untouched_final_DiaBLa_test_evaluated"] is False
          assert evidence["fresh_component_disjoint_Tatoeba_diagnostic"]["selected"]["n"]==256
          for variant in ("base","previous","selected"):
              assert evidence["fresh_component_disjoint_Tatoeba_diagnostic"][variant]["n"]==256
          candidates=sorted(incoming.rglob("candidate_step*.safetensors"))
          assert len(candidates)==4
          destination=Path("experiments/tatoeba_stage7_20261118/saved")
          destination.mkdir(parents=True,exist_ok=False)
          for source,name in ((rf[0],"report.json"),
                              (ef[0],"stage7_evaluation.json"),
                              (chosen[0],"adapter_selected.safetensors")):
              copy2(source,destination/name)
          for candidate in candidates:
              copy2(candidate,destination/candidate.name)
          note={
              "preservation_notice":"Preserve the original reports byte-for-byte; do not falsify prior evidence.",
              "old_label_warning":"The original run described DiaBLa as a FINAL external test, but all 144 DiaBLa dialogues had been previously evaluated in November 2026. It is correctly excluded from training but no longer an untouched final evaluation set.",
              "source":"research/continuation_final_audit_20261116/REPORT.md",
              "evaluation_status":"The 256 Tatoeba samples are new to this adapter training run, but are from publisher TRAIN split and have now been scored once. Not independent human correctness.",
              "90_percent_meaning_accuracy_verified":False
          }
          (destination/"HISTORICAL_EVALUATION_CORRECTION.json").write_text(
              json.dumps(note,indent=2)+"\n")
          with (destination/"SHA256SUMS.txt").open("w") as out:
              for item in sorted(destination.iterdir()):
                  if item.name!="SHA256SUMS.txt":
                      out.write(hashlib.sha256(item.read_bytes()).hexdigest()+
                                "  "+item.name+"\n")
          print("STAGE7_PRESERVED_MODEL_SHA",sha)
          print("FROZEN_ADAPTATION_TEST",evidence["fresh_component_disjoint_Tatoeba_diagnostic"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/tatoeba_stage7_20261118/saved
          git diff --cached --stat
          git commit -m "research: retain frozen stage-seven real-data model and correct consumed DiaBLa provenance [skip ci]"
          git push origin "HEAD:refs/heads/research/tatoeba-conversational-stage7-20261118"
