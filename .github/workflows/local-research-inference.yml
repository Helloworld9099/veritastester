name: Verify saved French and Spanish research adapters

on:
  push:
    branches: [research/local-adapter-review-20261117]
    paths:
      - experiments/local_adapter_review_20261117/**
      - .github/workflows/local-research-inference.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-inference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [french, spanish]
    name: Local research inference ${{ matrix.language }}
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CPU inference runtime
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0'
      - name: Validate checksum and provenance tests
        run: |
          python -m compileall -q experiments/local_adapter_review_20261117
          python -m unittest discover -s experiments/local_adapter_review_20261117/tests -p 'test_*.py' -v
      - name: Verify all three model variants generate actual text
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.language }}' == 'french' ]]; then text='Je voudrais une bouteille d eau.'; else text='Quisiera una botella de agua.'; fi
          for variant in base historical books; do
            python experiments/local_adapter_review_20261117/translate.py \
              --language '${{ matrix.language }}' --variant "$variant" --text "$text" \
              --cache-dir "$RUNNER_TEMP/model-cache" > "$RUNNER_TEMP/$variant.json"
            VARIANT="$variant" LANGUAGE='${{ matrix.language }}' OUTPUT="$RUNNER_TEMP/$variant.json" python -c 'import json,os; x=json.load(open(os.environ["OUTPUT"])); assert x["variant"]==os.environ["VARIANT"] and x["language"]==os.environ["LANGUAGE"] and x["research_only"]; assert isinstance(x["translation"],str) and x["translation"].strip(); print(x["language"],x["variant"],x["translation"][:100])'
          done
