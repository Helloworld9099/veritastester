name: Mine Spanish dev errors of ACTUAL incremental checkpoint (no final holdout)

on:
  push:
    branches: [train/es-en-v2]
    paths:
      - .github/workflows/es-en-v2-mine-real-dev.yml
      - research/es_en_v2/mine_dev_run.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dev-mining:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only model evaluator and MASSIVE adapter loader
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'datasets==2.21.0' 'huggingface-hub>=0.34,<1.0'
      - name: Evaluate actual 128 publisher-development rows, compare original versus accepted candidate
        run: python -u research/es_en_v2/mine_dev_run.py
      - name: Protect final test, save aggregate suspicion counts only
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('research/es_en_v2/dev_mining_receipt/dev_error_mining.json')
          x=json.loads(p.read_text())
          assert x['status']=='actual_dev_only_translation_mining'
          assert x['development_cases']==128
          assert x['heldout_or_test_read'] is False
          assert x['human_semantic_error_labels']==0
          assert x['parent_sha256']=='14dddb5040afe49f8f05a1bfba3458d3321524b53b0fc05b359ad41a1ab75a4b'
          assert x['candidate_sha256']=='3bf849bb9a4377dcb9f937cdc7750a7f26616fc1c58cf703cef0ba8e46430a71'
          (p.parent/'SHA256SUMS.txt').write_text(
              hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print('REAL_HARD_EXAMPLE_MINER_VALIDATED',json.dumps({
            'parent':x['model_scores']['parent'],
            'trained':x['model_scores']['after_three'],
            'changed':x['changed_translations_n']}))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/es_en_v2/dev_mining_receipt
          git commit -m 'research: preserve real development-only Spanish hard-error mining receipt [skip ci]'
          git pull --rebase origin train/es-en-v2
          git push origin HEAD:refs/heads/train/es-en-v2
      - name: Retain diagnostics on push failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es-en-v2-actual-spanish-dev-mining-diagnostic
          path: research/es_en_v2/dev_mining_receipt/dev_error_mining.json
          if-no-files-found: warn
          retention-days: 30
