name: Test Spanish sentence-by-sentence omission recovery on reviewed development examples

on:
  push:
    branches: [feat/bridgecaption-shared-french-spanish-20261120]
    paths:
      - .github/workflows/unified-spanish-segment-recovery.yml
      - research/unified_models/segment_eval.py
      - research/unified_models/segmented_recovery.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unified-spanish-segment-recovery
  cancel-in-progress: false

jobs:
  actual-source-preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONPATH: ".:src"
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install free CPU research dependencies only
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0'
      - name: Verify clause splitter never omits source text
        run: |
          python -m unittest research.unified_models.tests.test_segmented_recovery -v
      - name: Generate ACTUAL Spanish segmented-model responses for 8 reviewed cases
        run: |
          python -u research/unified_models/segment_eval.py
      - name: Verify no fake human quality or silent old model activation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('research/unified_models/receipts/spanish_segment_ablation/source_clauses_actual_model_outputs.json')
          d=json.loads(p.read_text())
          assert d['status']=='actual_spanish_clause_preservation_development_ablation'
          assert d['model_sha256']=='3bf849bb9a4377dcb9f937cdc7750a7f26616fc1c58cf703cef0ba8e46430a71'
          assert d['reviewer_rows']==[311,314,416,33,35,79,219,220]
          assert len(d['examples'])==8
          assert d['final_holdout_used'] is False
          assert d['human_adequacy_verified'] is False
          assert d['production_enabled'] is False
          assert d['source_or_target_references_used_for_training'] is False
          (p.parent/'SHA256SUMS.txt').write_text(
              hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print('VERIFIED_REAL_SPANISH_SEGMENTED_RESPONSES',json.dumps({
            'clauses_nonempty':d['all_clauses_generated'],
            'no_loops':d['final_outputs_without_long_repetition'],
            'quality_claims':False}))
          PY
      - name: Save isolated experimental output receipt without changing product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/unified_models/receipts/spanish_segment_ablation
          git commit -m 'research: preserve actual Spanish multi-clause recovery candidates without human accuracy claim [skip ci]'
          git pull --rebase origin feat/bridgecaption-shared-french-spanish-20261120
          git push origin HEAD:refs/heads/feat/bridgecaption-shared-french-spanish-20261120
      - name: Keep outputs available after a Git push conflict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spanish-model-real-clause-preservation-dev-ablation
          path: research/unified_models/receipts/spanish_segment_ablation/
          if-no-files-found: warn
          retention-days: 30
