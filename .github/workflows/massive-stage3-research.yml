name: MASSIVE stage-three continuation from verified stage-two adapters

on:
  push:
    branches: [research/massive-stage3-fresh-cohorts-20261117]
    paths:
      - .github/workflows/massive-stage3-research.yml
      - experiments/massive_stage3_20261117/**
      - experiments/massive_stage2_20261117/train_stage2.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-stage3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-stage3:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        language: [french, spanish]
    name: MASSIVE Stage3 ${{ matrix.language }} unseen utterances
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install free CPU training dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0' 'datasets==2.21.0'
      - name: Verify data integrity, historical adapter checksums and heldout exclusions
        run: |
          python -m compileall -q experiments/massive_stage3_20261117
          python -m unittest discover -s experiments/massive_stage3_20261117/tests -p 'test_*.py' -v
      - name: Train third-stage adapter and open fresh heldout only once
        run: |
          python -u experiments/massive_stage3_20261117/train_stage3.py --language '${{ matrix.language }}' --output-dir "$RUNNER_TEMP/massive3-${{ matrix.language }}"
      - name: Preserve research results and candidate LoRA adapters (no raw corpus)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: massive-stage3-${{ matrix.language }}
          path: |
            ${{ runner.temp }}/massive3-${{ matrix.language }}/report.json
            ${{ runner.temp }}/massive3-${{ matrix.language }}/stage3_evaluation.json
            ${{ runner.temp }}/massive3-${{ matrix.language }}/candidate_step*.safetensors
            ${{ runner.temp }}/massive3-${{ matrix.language }}/candidate_selected.safetensors
          if-no-files-found: warn
          retention-days: 30
