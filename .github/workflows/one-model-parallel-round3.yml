name: BridgeCaption round3 real shared-model licensed-parallel continuation

on:
  push:
    branches: [feat/global-language-architecture-and-conversation-training-20261121]
    paths:
      - .github/workflows/one-model-parallel-round3.yml
      - research/conversation_growth/config_round3.json
      - research/conversation_growth/round3.py
      - research/conversation_growth/round3_data.py
      - research/conversation_growth/round3_tests/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgecaption-one-model-parallel-round3
  cancel-in-progress: false

jobs:
  cpu-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ".:src"
      HF_HOME: /tmp/bridgecaption-m2m100-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      BRIDGE_NO_PAID_APIS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned free CPU-only learning dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'datasets==2.21.0' 'huggingface-hub==0.36.0' 'hf-xet>=1.1,<2'
      - name: Run data leak, learning-rate, and dual-gate regression tests
        run: |
          python -m compileall -q research/conversation_growth
          python -m unittest discover -s research/conversation_growth/round3_tests -p 'test_*.py' -v
          python -m unittest discover -s research/conversation_growth/round2_tests -p 'test_*.py' -v
          python -m unittest discover -s research/conversation_growth/tests -p 'test_*.py' -v
      - name: Verify past best weights, prior results, attribution and no paid spend
        run: |
          python - <<'PY'
          from research.conversation_growth.round3_data import settings
          from research.multilingual_student.train import ensure_old_winners_untouched
          from pathlib import Path
          import hashlib,json
          cfg,_=settings()
          parent=Path(cfg['parent']['path'])
          assert hashlib.sha256(parent.read_bytes()).hexdigest()==cfg['parent']['sha256']
          previous=json.loads(Path('research/conversation_growth/experiment_002/report.json').read_text())
          assert previous['checkpoint_decision']=='previous_rank4_champion_preserved_all_candidates_rejected'
          assert previous['selected_sha256']==cfg['parent']['sha256']
          assert len(ensure_old_winners_untouched())==2
          assert cfg['data']['license']=='CC-BY-2.0-FR'
          assert cfg['restrictions']['no_paid_compute'] is True
          assert cfg['restrictions']['no_production_changes'] is True
          print('ORIGINAL_LEARNED_MODEL_AND_RIGHTS_REMAIN_PINNED')
          PY
      - name: Train the same neural model on expanded licensed bilingual examples
        run: python -u research/conversation_growth/round3.py
      - name: Check real update count, train/dev disjoint receipts and selected weights
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          from safetensors import safe_open
          root=Path('research/conversation_growth/experiment_003')
          receipt=json.loads((root/'report.json').read_text())
          assert receipt['status']=='actual_shared_rank4_parallel_round3_completed'
          assert receipt['actual_optimizer_updates']==240
          assert set(receipt['routes'])=={'en-es','es-en','en-fr','fr-en','es-fr','fr-es'}
          assert all(n==40 for n in receipt['routes'].values())
          assert receipt['parent_file_unchanged'] and receipt['original_specialists_unchanged']
          assert receipt['train_manifest']['train_dev_cross_pair_disjoint_by_text']
          assert receipt['train_manifest']['new_dev_outside_original_350']
          assert receipt['train_manifest']['old_500_reviewed_not_used']
          assert receipt['train_manifest']['no_final_holdout']
          assert receipt['train_manifest']['no_MASSIVE_as_parallel_gold']
          assert receipt['release_approved'] is False
          assert receipt['human_semantic_accuracy_verified'] is False
          assert receipt['production_provider_or_ASR_modified'] is False
          assert receipt['paid_spend_usd']==0
          for step in (60,120,240):
              p=root/f'shared_lora_parallel_extra{step:03d}.safetensors'
              assert p.is_file()
              with safe_open(p,framework='pt',device='cpu') as f:
                  assert len(list(f.keys()))==24
          selected=Path(receipt['selected_path'])
          assert selected.exists() and hashlib.sha256(selected.read_bytes()).hexdigest()==receipt['selected_sha256']
          for line in (root/'SHA256SUMS.txt').read_text().splitlines():
              digest,filename=line.split('  ')
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==digest
          if receipt['selected_sha256'] != receipt['parent_sha256']:
              assert any(c['eligible_for_research_only'] and c['sha256']==receipt['selected_sha256']
                         for c in receipt['checkpoints'].values())
          print('ACTUAL_240_STEP_SHARED_MODEL_CONTINUATION_VERIFIED',json.dumps({
            'selected_sha256':receipt['selected_sha256'],
            'decision':receipt['checkpoint_decision'],
            'updates':receipt['actual_optimizer_updates'],
            'not_an_accuracy_claim':True
          }))
          PY
      - name: Preserve new experimental checkpoints and verification receipts in research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/conversation_growth/experiment_003
          git commit -m 'train: preserve 240 step licensed shared-model experiment and DEV gates [skip ci]'
          git pull --rebase origin feat/global-language-architecture-and-conversation-training-20261121
          git push origin HEAD:refs/heads/feat/global-language-architecture-and-conversation-training-20261121
      - name: Keep independently accessible training artifacts if push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridgecaption-one-model-parallel-round3-real
          path: research/conversation_growth/experiment_003/
          if-no-files-found: warn
          retention-days: 30
