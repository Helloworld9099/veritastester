name: Compare licensed hard-case parallel data strategies WITHOUT blindly retraining 3B

on:
  push:
    branches: [train/madlad400-3b-shared-20261121]
    paths: [research/madlad400/data_ablation_request.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  authentic_parallel_stratification:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONPATH: ".:src"
      HF_HUB_DISABLE_TELEMETRY: "1"
      BRIDGE_NO_PAID_APIS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only free dataset dependencies, no 3B models or GPU frameworks
        run: python -m pip install 'datasets==2.21.0' 'huggingface-hub==0.36.0' 'hf-xet>=1.1,<2'
      - name: Test deterministic real-data selection and leakage/rights guard
        run: |
          python -m unittest research.madlad400.tests.test_data_ablation -v
          python -m py_compile research/madlad400/data_ablation.py
      - name: Actually compare random vs targeted idiom/negation/pronoun/number/clause data samples
        run: python -u research/madlad400/data_ablation.py
      - name: Verify three real Tatoeba archives, six weakness categories, no false neural updates
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('research/madlad400/data_ablation_001')
          r=json.loads((root/'report.json').read_text())
          assert r['status']=='actual_three_corpus_parallel_data_selection_ablation_completed'
          assert set(r['comparisons'])=={'en-es','en-fr','es-fr'}
          assert r['source_license'].startswith('Tatoeba CC BY 2.0 FR')
          assert r['publisher_validation_and_500_reviewed_excluded'] is True
          assert r['final_holdout_accessed'] is False
          assert r['new_optimizer_updates']==0
          assert r['hard_case_correctness_independently_verified'] is False
          assert r['slang_rows_must_be_reviewed_before_supervised_training'] is True
          assert r['deployment_approved'] is False
          assert r['paid_spend_usd']==0
          assert set(r['strategies_tested'])=={
              'deterministic_random','stratified_hard_phenomena'}
          for pair,value in r['comparisons'].items():
              assert len(value['source_zip_sha256'])==64
              assert value['random_baseline']['count']==350
              assert value['category_stratified_candidate']['count']>=116
              assert len(value['hard_category_coverage_delta'])==6
              assert value['human_translation_quality_unverified'] is True
          assert hashlib.sha256((root/'report.json').read_bytes()).hexdigest()==(
              root/'report.sha256').read_text().split('  ')[0]
          print('REAL_TWO_SOURCE_DATA_STRATEGIES_COMPARED_NO_FALSE_TRAINING',r['comparisons'])
          PY
      - name: Commit provenance, category statistics and experiment outcome, no unverified parallel pairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/madlad400/data_ablation_001/
          git commit -m 'research: actual licensed hard-case vs random Tatoeba sample coverage comparison [skip ci]'
          git pull --rebase origin train/madlad400-3b-shared-20261121
          git push origin HEAD:refs/heads/train/madlad400-3b-shared-20261121
      - name: Reviewer-only hard cases are not trusted training gold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licensed-parallel-idiom-context-bilingual-review-candidates
          path: |
            ${{ runner.temp }}/madlad400-hard-examples/potential_hard_examples.jsonl
            research/madlad400/data_ablation_001/report.json
          if-no-files-found: warn
          retention-days: 30
