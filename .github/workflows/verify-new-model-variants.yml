name: Verify saved research-only MASSIVE translations

on:
  push:
    branches: [research/model-variant-review-20261117]
    paths:
      - experiments/local_adapter_review_20261117/**
      - .github/workflows/verify-new-model-variants.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install free CPU inference dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0'
      - name: Check model provenance and rejection safeguards
        run: |
          python -m compileall -q experiments/local_adapter_review_20261117
          python -m unittest discover -s experiments/local_adapter_review_20261117/tests -p 'test_*.py' -v
      - name: Run actual offline MASSIVE model inference, French and Spanish
        run: |
          python experiments/local_adapter_review_20261117/translate.py --language french --variant massive --text 'Mets une alarme demain matin' > "$RUNNER_TEMP/fr.json"
          python experiments/local_adapter_review_20261117/translate.py --language spanish --variant massive --text 'Pon una alarma manana' > "$RUNNER_TEMP/es.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          t = Path(os.environ["RUNNER_TEMP"])
          for lang, expected in [
              ("fr", "5c5094a3f8dfc9d783f6e8482ae8ed2fad7e632b81b31f20f54fa8f288538ad8"),
              ("es", "e60fbadae2037686f9693af4be2e7e59b128aa44f4be8c287f40b7f893b0a004"),
          ]:
              output = json.loads((t / (lang + ".json")).read_text())
              assert output["variant"] == "massive" and output["research_only"] is True
              assert output["adapter_sha256"] == expected
              assert isinstance(output["translation"], str) and output["translation"].strip()
              print("REAL CPU INFERENCE PASS", lang, "adapter SHA-256", expected)
          PY
