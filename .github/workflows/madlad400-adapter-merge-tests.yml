name: Verify learned MADLAD LoRA can be merged for efficient single-model deployment

on:
  push:
    branches: [train/madlad400-3b-shared-20261121]
    paths:
      - .github/workflows/madlad400-adapter-merge-tests.yml
      - research/madlad400/model.py
      - research/madlad400/tests/test_model_contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-3b-weight-unit-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PYTHONPATH: ".:src"
      OMP_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only free official CPU PyTorch (no 3B model download)
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check exact learned q/v tensor merge and no base regression on toy network
        run: |
          python -m unittest research.madlad400.tests.test_model_contract -v
          python -m py_compile research/madlad400/model.py
          echo 'THIS_IS_MATH_VERIFICATION_NOT_ACTUAL_NEW_3B_TRAINING'
