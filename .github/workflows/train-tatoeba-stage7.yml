name: TRAIN Stage 7 French on real Tatoeba everyday language plus MASSIVE rehearsal
on:
  push:
    branches: [research/tatoeba-conversational-stage7-20261118]
    paths:
      - .github/workflows/train-tatoeba-stage7.yml
      - experiments/tatoeba_stage7_20261118/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tatoeba-stage7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  french-tatoeba:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install free CPU-only training and verified dataset dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0' 'datasets==2.21.0'
      - name: Verify immutable warm adapter and all component/test boundaries
        run: |
          python -m compileall -q experiments/tatoeba_stage7_20261118
          python -m unittest discover -s experiments/tatoeba_stage7_20261118/tests -p 'test_*.py' -v
      - name: TRAIN 192 French LoRA optimizer updates using component-disjoint real dialogues
        run: |
          python -u experiments/tatoeba_stage7_20261118/train_stage7.py \
            --output-dir "$RUNNER_TEMP/tatoeba-stage7"
      - name: Retain ONLY candidate adapters and aggregate counts, never raw text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tatoeba-stage7-french-research
          path: |
            ${{ runner.temp }}/tatoeba-stage7/report.json
            ${{ runner.temp }}/tatoeba-stage7/stage7_evaluation.json
            ${{ runner.temp }}/tatoeba-stage7/candidate_step*.safetensors
            ${{ runner.temp }}/tatoeba-stage7/candidate_selected.safetensors
          if-no-files-found: warn
          retention-days: 30
