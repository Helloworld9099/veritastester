name: Compare real Spanish decode variants on human-reviewed omissions

on:
  push:
    branches: [feat/bridgecaption-shared-french-spanish-20261120]
    paths:
      - .github/workflows/unified-reviewed-spanish-ablation.yml
      - research/unified_models/experiments/retry_candidates.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-spanish-reviewed-decoder-ablation
  cancel-in-progress: false

jobs:
  controlled-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONPATH: ".:src"
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install free CPU-only old-version-compatible research model requirements
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0'
      - name: Compare current model, original base, prior allowed checkpoint and four decoder strategies
        run: |
          python -u research/unified_models/experiments/retry_candidates.py
      - name: Verify no false human adequacy claim or test contamination
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('research/unified_models/receipts/spanish_review_decoder_ablation/actual_decode_candidates.json')
          d=json.loads(p.read_text())
          assert d['status']=='real_development_only_decode_comparison'
          assert d['tested_cases_n']==8
          assert d['reviewed_long_loops']==[311,314,416]
          assert len(d['actual_model_predictions'])==8
          assert d['human_translation_quality_verified'] is False
          assert d['no_new_optimizer_steps'] is True
          assert d['no_nc_model_or_data_involved'] is True
          assert d['test_or_final_holdout_not_accessed'] is True
          assert d['default_app_provider_changed'] is False
          assert d['trained_model_sha256']=='3bf849bb9a4377dcb9f937cdc7750a7f26616fc1c58cf703cef0ba8e46430a71'
          assert d['previous_permitted_adapter_sha256']=='14dddb5040afe49f8f05a1bfba3458d3321524b53b0fc05b359ad41a1ab75a4b'
          assert all(len(row['variants'])==6 for row in d['actual_model_predictions'])
          (p.parent/'SHA256SUMS.txt').write_text(
              hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print('SPANISH_REVIEW_DECODER_ALTERNATIVES_VERIFIED',json.dumps(d['diagnostic_counts_not_quality_scores']))
          PY
      - name: Preserve real outputs in isolated research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/unified_models/receipts/spanish_review_decoder_ablation
          git commit -m 'research: preserve real Spanish reviewed decoder candidates without false accuracy [skip ci]'
          git pull --rebase origin feat/bridgecaption-shared-french-spanish-20261120
          git push origin HEAD:refs/heads/feat/bridgecaption-shared-french-spanish-20261120
      - name: Retain candidates on runner even if push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spanish-reviewed-semantic-recovery-decode-ablation
          path: research/unified_models/receipts/spanish_review_decoder_ablation/
          if-no-files-found: warn
          retention-days: 30
