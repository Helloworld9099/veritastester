name: BridgeCaption foundation tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test,eval]'
      - name: Compile Python source
        run: python -m compileall -q src tests
      - name: Run tests without provider credentials
        env:
          GEMINI_API_KEY: ''
          GROQ_API_KEY: ''
          AZURE_TRANSLATOR_KEY: ''
          BRIDGE_CONTEXT_MODEL: ''
        run: python -m pytest -q
