name: MASSIVE stage-two training from selected adapters

on:
  push:
    branches: [research/massive-second-stage-20261117]
    paths:
      - .github/workflows/massive-stage2-research.yml
      - experiments/massive_stage2_20261117/**
      - experiments/massive_20261117/train_massive.py
      - experiments/cpu_continuation_20261117/train.py
      - experiments/opus_books_20261117/train_books.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-stage2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-two:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        language: [french, spanish]
    name: Stage2 ${{ matrix.language }} new MASSIVE cohorts
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install free CPU research dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0' 'datasets==2.21.0'
      - name: Compile and verify old/new cohort isolation
        run: |
          python -m compileall -q experiments/massive_stage2_20261117
          python -m unittest discover -s experiments/massive_stage2_20261117/tests -p 'test_*.py' -v
      - name: Train from SHA-pinned stage-one adapter, score new heldout once
        run: |
          python -u experiments/massive_stage2_20261117/train_stage2.py --language '${{ matrix.language }}' --output-dir "$RUNNER_TEMP/massive2-${{ matrix.language }}"
      - name: Preserve only candidate LoRA adapters and aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: massive-stage2-${{ matrix.language }}
          path: |
            ${{ runner.temp }}/massive2-${{ matrix.language }}/report.json
            ${{ runner.temp }}/massive2-${{ matrix.language }}/stage2_evaluation.json
            ${{ runner.temp }}/massive2-${{ matrix.language }}/candidate_step*.safetensors
            ${{ runner.temp }}/massive2-${{ matrix.language }}/candidate_selected.safetensors
          if-no-files-found: warn
          retention-days: 30
