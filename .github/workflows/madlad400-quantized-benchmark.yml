name: Optimize 425-language MADLAD via REAL INT8 CPU inference A/B instead of more training

on:
  push:
    branches: [train/madlad400-3b-shared-20261121]
    paths:
      - research/madlad400/quantized_request.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-madlad-3b-ct2-int8-ablation-only
  cancel-in-progress: false

jobs:
  quantized-cpu-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ".:src"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /tmp/madlad-int8-benchmark
      TOKENIZERS_PARALLELISM: "false"
      BRIDGE_NO_PAID_APIS: "true"
      OMP_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install free official CPU libraries, CTranslate2 and permitted evaluation datasets
        run: |
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'ctranslate2>=4.6,<5' 'datasets==2.21.0' 'huggingface-hub==0.36.0' 'hf-xet>=1.1,<2'
      - name: Verify third-party INT8 revision cannot be unlicensed, oversized, modified, or substituted
        run: |
          python -m unittest research.madlad400.tests.test_quantized_ablation -v
          python -m unittest research.madlad400.tests.test_optimization_controller -v
          python -m py_compile research/madlad400/quantized_ablation.py
      - name: REAL 3B INT8 CPU benchmark across all six trained directions plus four other languages
        run: python -u research/madlad400/quantized_ablation.py
      - name: Verify actual 3B model decode measurements, A/B and independent review warnings
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('research/madlad400/efficiency_001')
          report=json.loads((root/'report.json').read_text())
          assert report['status']=='actual_free_MADLAD400_int8_CPU_inference_ablation_completed'
          assert report['pinned_conversion']['license']=='apache-2.0'
          assert len(report['pinned_conversion']['converted_commit'])==40
          assert report['model_loads']==1
          assert set(report['beam_decoding_comparisons'])=={'beam_1','beam_2'}
          for value in report['beam_decoding_comparisons'].values():
              assert value['tested_utterances']==24
              assert len(value['per_route_metrics'])==6
              assert 0<value['p95_seconds']<180
              assert all(row['n']==4 for row in value['per_route_metrics'].values())
          assert set(report['additional_native_language_sentinels'])=={
              'en-de','en-pt','en-ar','en-zh'}
          assert not report['human_95_accuracy_verified']
          assert not report['production_activated']
          assert report['new_training_updates']==0
          assert not report['publisher_test_accessed']
          assert report['paid_spend_usd']==0
          assert hashlib.sha256((root/'report.json').read_bytes()).hexdigest()==(
              root/'report.sha256').read_text().split('  ')[0]
          print('REAL_425_LANGUAGE_INT8_MODEL_ABLATION_NOT_SAME_TRAINING_LOOP',json.dumps({
              'beam1_p95_s':report['beam_decoding_comparisons']['beam_1']['p95_seconds'],
              'beam2_p95_s':report['beam_decoding_comparisons']['beam_2']['p95_seconds'],
              'rss_mib':report['peak_rss_kib_linux']//1024,
              'future_production_approved':False}))
          PY
      - name: Preserve only evidence and pinned third-party conversion checksum, not multi-GB weights
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/madlad400/efficiency_001/
          git commit -m 'performance: save REAL 3B INT8 CPU one-model beam ablation and licensed provenance [skip ci]'
          git pull --rebase origin train/madlad400-3b-shared-20261121
          git push origin HEAD:refs/heads/train/madlad400-3b-shared-20261121
      - name: Preserve observations if training and docs concurrent branch push conflicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-MADLAD400-3B-int8-CPU-benchmarks-and-outputs
          path: research/madlad400/efficiency_001/
          if-no-files-found: warn
          retention-days: 30
