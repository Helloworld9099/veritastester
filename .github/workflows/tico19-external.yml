name: TICO-19 frozen cross-domain model benchmark (free CPU)

on:
  push:
    branches: [research/tico19-external-benchmark-20261117]
    paths:
      - .github/workflows/tico19-external.yml
      - experiments/tico19_20261117/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tico19-frozen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        language: [french, spanish]
    name: TICO19 ${{ matrix.language }} frozen model comparison
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install free CPU translation dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-replay.txt
          python -m pip install 'huggingface-hub>=0.34,<1.0'
      - name: Verify bilingual alignment and frozen benchmark sample selection
        run: |
          python -m compileall -q experiments/tico19_20261117
          python -m unittest discover -s experiments/tico19_20261117/tests -p 'test_*.py' -v
      - name: Compare four frozen model versions; no new training
        run: |
          python -u experiments/tico19_20261117/eval_tico.py --language '${{ matrix.language }}' --output-dir "$RUNNER_TEMP/tico-${{ matrix.language }}"
      - name: Preserve aggregate diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tico19-cross-domain-${{ matrix.language }}
          path: ${{ runner.temp }}/tico-${{ matrix.language }}/external_benchmark.json
          if-no-files-found: warn
          retention-days: 30
