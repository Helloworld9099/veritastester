[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgecaption"
version = "0.1.0"
description = "AI-powered, context-aware Linux live-translation overlay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.1,<2", "numpy>=1.24", "python-dotenv>=1.0", "cryptography>=43,<47"]

[project.optional-dependencies]
eval = ["sacrebleu>=2", "jiwer>=3"]
test = ["pytest>=8"]
research = ["scikit-learn>=1.4,<2"]

[project.scripts]
bridgecaption = "bridgecaption.app:main"
bridgecaption-train = "bridgecaption.training:main"
bridgecaption-eval = "bridgecaption.evaluate:main"
bridgecaption-preflight = "bridgecaption.preflight:main"
bridgecaption-train-memory = "bridgecaption.research_training:main"
bridgecaption-eval-context = "bridgecaption.evaluate_context:main"
bridgecaption-train-sense = "bridgecaption.sense_model:main"
bridgecaption-check = "bridgecaption.diagnostics:main"
bridgecaption-eval-audio = "bridgecaption.evaluate_audio:main"
bridgecaption-annotate = "bridgecaption.annotate:main"
bridgecaption-prep-corpus = "bridgecaption.corpus_prep:main"
bridgecaption-corpus-curriculum = "bridgecaption.corpus_curriculum:main"
bridgecaption-train-idiom = "bridgecaption.idiom_ablation:main"
bridgecaption-corpus-review = "bridgecaption.corpus_review:main"
bridgecaption-export-review = "bridgecaption.review_export:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
